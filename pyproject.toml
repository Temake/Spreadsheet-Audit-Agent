[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-audit"
version = "0.1.0"
description = "An AI agent that audits spreadsheets for data quality issues with evidence-backed findings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "defusedxml>=0.7",   # openpyxl uses it automatically to block XML entity attacks
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sheet-audit = "sheet_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "samples"]
markers = ["bedrock: calls the real AWS Bedrock API (skipped unless AUDIT_BEDROCK_MODEL_ID is set)"]
